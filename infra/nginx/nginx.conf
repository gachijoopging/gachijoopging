# 앱이 붙는 단일 입구. 443 을 잡고 길을 나눈다.
#
# 경로를 고쳐 보내지 않는다. 백엔드가 /api/v1 접두사를 스스로 붙인다
# (WebConfig.configurePathMatch 의 addPathPrefix) — 떼서 보내면 핸들러를 못 찾고,
# SecurityConfig 의 anyRequest().authenticated() 에 걸려 전부 401 이 된다.
#
# AI 서버는 외부에 열지 않는다. 백엔드만 AI_BASE_URL 로 부른다.
#
# 이 파일은 그대로 쓰이지 않는다. 컨테이너가 envsubst 로 ${MEDIA_SECURE_LINK_SECRET} 와
# ${MEDIA_ROOT} 둘만 바꿔 /etc/nginx/nginx.conf 를 만든다(docker-compose.yml 의 nginx command).
# $host·$uri 같은 nginx 변수는 그대로 남는다 — envsubst 에 그 이름을 넘기지 않았기 때문이다.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 사진 업로드. application.yml 의 max-request-size(22MB)와 같아야 한다 —
    # 여기가 작으면 Nginx 가 먼저 끊어서 우리 오류 봉투가 나가지 못한다.
    client_max_body_size 22m;

    server_tokens off;

    # 접속 로그에 쿼리스트링을 찍지 않는다. 기본 combined 의 "$request" 는 쿼리까지 남기는데,
    # 소켓은 ?token= 에 액세스 토큰을, 사진은 서명을 싣는다. 로그는 90일 보관된다(operations.md §로그).
    # stdout 으로 가는 이미지의 기본 경로를 그대로 쓴다 — 그래야 journald 로 간다.
    log_format noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log noquery;

    # ── 80 — 인증서 발급·갱신과 HTTPS 로 보내기 ─────────────────────
    server {
        listen 80;
        server_name gachijoopging.site www.gachijoopging.site;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://www.gachijoopging.site$request_uri;
        }
    }

    # ── 443 apex — www 로 보낸다 ────────────────────────────────────
    # operations.md: apex 는 301 이라 쓰지 않는다.
    server {
        listen 443 ssl;
        http2 on;
        server_name gachijoopging.site;

        ssl_certificate     /etc/letsencrypt/live/www.gachijoopging.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.gachijoopging.site/privkey.pem;

        return 301 https://www.gachijoopging.site$request_uri;
    }

    # ── 443 www — 정식 주소 ─────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name www.gachijoopging.site;

        ssl_certificate     /etc/letsencrypt/live/www.gachijoopging.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.gachijoopging.site/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # 채팅·위치. STOMP over WebSocket (realtime.md).
        location /api/v1/ws {
            # 변수로 써야 nginx 가 시작할 때가 아니라 요청할 때 이름을 해석한다.
            # 고정 이름으로 쓰면 백엔드가 아직 없을 때 nginx 가 아예 뜨지 않는다.
            resolver 127.0.0.11 valid=10s;
            set $upstream backend:8080;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 기본 60초면 조용한 구간에서 소켓이 끊긴다. 앱은 끊기면 지수 백오프로
            # 다시 붙지만(realtime.md §끊김) 그 사이 채팅·위치가 비므로 길게 잡는다.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        location /api/v1/ {
            resolver 127.0.0.11 valid=10s;
            set $upstream backend:8080;
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # 격리된 사진은 서명이 있어도 내보내지 않는다. /media/ 보다 긴 접두사라 이쪽이 먼저 걸린다.
        location /media/deleted/ {
            return 403;
        }

        # 사진. 백엔드를 거치지 않고 디스크에서 바로 보낸다(결정 33).
        #
        # 서명은 백엔드 MediaSignedUrl 이 만든다. 아래 식이 그쪽과 한 글자라도 다르면
        # 모든 사진이 403 이 되는데, 그 사실은 배포한 뒤에야 드러난다.
        #   raw = <만료><uri> <비밀>  →  MD5  →  base64url(패딩 없음)
        location /media/ {
            secure_link $arg_s,$arg_e;
            secure_link_md5 "$secure_link_expires$uri ${MEDIA_SECURE_LINK_SECRET}";

            # 빈 값은 서명이 틀린 것, "0" 은 만료다. 둘 다 403 으로 같게 답한다 —
            # 나눠 주면 어느 쪽이 틀렸는지 알려 주는 꼴이 된다.
            if ($secure_link = "") { return 403; }
            if ($secure_link = "0") { return 403; }

            alias ${MEDIA_ROOT}/;
        }

        # 헬스체크만 연다. /actuator 전체를 열면 prometheus 지표가 같이 공개된다
        # (application.yml 의 exposure include 가 health,prometheus 다).
        location = /actuator/health {
            resolver 127.0.0.11 valid=10s;
            set $upstream backend:8080;
            proxy_pass http://$upstream/actuator/health;
            proxy_set_header Host $host;
        }

        # 약관·개인정보처리방침·마케팅 동의 전문. 앱 1-3 가입 화면이 이 주소를 연다.
        # 정본은 docs/legal/*.md 이고, infra/legal/build.mjs 가 만든 HTML 을 그대로 보낸다.
        location ~ ^/(terms|privacy|marketing)$ {
            root /srv/legal;
            try_files /$1.html =404;
            # mime.types 의 text/html 에는 charset 이 없다. 없으면 브라우저가 한글을 깨뜨린다.
            charset utf-8;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 404;
        }
    }
}
