<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가치줍깅 프로토타입</title>
  <style>
    :root {
      --bg: #DCE6A6;
      --surface: #FDFDF3;
      --ink: #262A0E;
      --ink-muted: #5C6142;
      --deep: #3D431F;
      --lime: #C9E345;
      --yellow: #F4F04B;
      --border: #DEE3BD;
      --danger: #C44343;
      --warn: #8C5316;
      --screen-padding: 20px;
      --min-touch: 48px;
      --nav-height: 68px;
      --card-radius: 26px;
      --sheet-radius: 30px;
      --shadow-card: 0 2px 8px rgba(101, 114, 28, 0.12);
      --shadow-overlay: 0 12px 32px rgba(101, 114, 28, 0.24);
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    ::selection { color: var(--ink); background: var(--lime); }
    button, input, textarea, select { font: inherit; }
    button, input, select { min-height: var(--min-touch); }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--deep); outline-offset: 2px; }
    .prototype-frame { display: grid; grid-template-columns: 260px minmax(0, 360px); gap: 24px; width: min(100% - 32px, 660px); margin: 24px auto; align-items: start; }
    #app { min-height: 760px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 34px; box-shadow: var(--shadow-overlay); }
    #review-panel { position: sticky; top: 24px; min-height: 160px; padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--card-radius); box-shadow: var(--shadow-card); }
    #sheet-root:empty { display: none; }
    .screen { display: flex; min-height: 760px; flex-direction: column; gap: 20px; overflow-x: hidden; padding: var(--screen-padding); }
    .screen-header, .list-row, .nav, .split, .button-row, .meta { display: flex; align-items: center; }
    .screen-header { justify-content: space-between; gap: 8px; }
    .screen-header h1 { margin: 0; font-size: 20px; }
    .screen-header p, .subtle, .caption { margin: 0; color: var(--ink-muted); }
    .subtle { min-width: 0; overflow-wrap: anywhere; line-height: 1.55; }
    .caption { font-size: 13px; }
    .display { margin: 0; font-size: 26px; line-height: 1.25; letter-spacing: -0.03em; overflow-wrap: anywhere; }
    .section-title { margin: 0; font-size: 16px; }
    .card { padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--card-radius); box-shadow: var(--shadow-card); }
    .stack { display: grid; gap: 12px; min-width: 0; }
    .tight { display: grid; gap: 8px; }
    .split { justify-content: space-between; gap: 12px; }
    .button-row { gap: 8px; }
    .button { width: 100%; border: 0; border-radius: 999px; padding: 12px 16px; font-weight: 700; transition: transform 160ms ease, box-shadow 160ms ease; }
    .button:hover { transform: translateY(-1px); box-shadow: var(--shadow-card); }
    .button--primary { color: var(--ink); background: linear-gradient(90deg, var(--lime), var(--yellow)); }
    .button--soft { color: var(--ink); background: #F2F5DD; }
    .button--ghost { color: var(--deep); background: transparent; border: 1px solid var(--border); }
    .button--danger { color: #fff; background: var(--danger); }
    .icon-button { width: var(--min-touch); min-width: var(--min-touch); padding: 0; border: 1px solid var(--border); border-radius: 999px; color: var(--deep); background: var(--surface); font-size: 18px; }
    .list-row { min-height: var(--min-touch); justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); color: var(--ink); background: transparent; text-align: left; }
    .list-row:last-child { border-bottom: 0; }
    .list-row[role="button"] { width: 100%; border-inline: 0; border-top: 0; }
    .field { width: 100%; padding: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
    textarea.field { min-height: 104px; resize: vertical; }
    label { display: grid; gap: 4px; font-weight: 700; }
    .state-panel { padding: 12px; color: var(--ink-muted); background: #F2F5DD; border-radius: 18px; }
    .state-panel--error { color: var(--danger); background: #FFD9D2; }
    .state-panel--offline { color: var(--warn); background: #FFF6EA; }
    .map-placeholder, .camera-placeholder { display: grid; min-height: 210px; place-items: center; border-radius: var(--card-radius); color: var(--surface); background: #657D39; text-align: center; }
    .camera-placeholder { background: #22260F; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .metric { padding: 12px 8px; background: #F2F5DD; border-radius: 18px; text-align: center; }
    .metric strong { display: block; font-size: 19px; }
    .chip { display: inline-flex; align-items: center; min-height: 32px; padding: 6px 10px; border-radius: 999px; color: #F4F04B; background: var(--deep); font-size: 12px; font-weight: 700; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; }
    .tabs button { min-width: max-content; min-height: 38px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 999px; color: var(--ink-muted); background: var(--surface); }
    .tabs button[aria-pressed="true"] { color: #F4F04B; background: var(--deep); border-color: var(--deep); }
    .nav { position: sticky; bottom: 0; justify-content: space-around; min-height: var(--nav-height); margin: auto -20px -20px; padding: 8px; background: var(--surface); border-top: 1px solid var(--border); }
    .nav button { min-width: 48px; color: var(--ink-muted); background: transparent; border: 0; }
    .nav button[aria-current="page"] { color: var(--deep); font-weight: 800; }
    .review-title { margin: 0 0 8px; font-size: 16px; }
    .review-select { width: 100%; margin-top: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 12px; color: var(--ink); background: var(--surface); }
    .review-button { margin-top: 8px; }
    .sheet-scrim { position: fixed; inset: 0; z-index: 10; display: grid; align-items: end; background: rgba(38, 42, 14, 0.45); }
    .sheet { width: min(100%, 360px); margin: 0 auto; padding: 24px 20px; background: var(--surface); border-radius: var(--sheet-radius) var(--sheet-radius) 0 0; box-shadow: var(--shadow-overlay); }
    .screen-list { max-height: 55vh; overflow-y: auto; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .calendar button { min-width: 0; border: 1px solid var(--border); border-radius: 10px; color: var(--ink); background: var(--surface); }
    .calendar button[data-active="true"] { background: var(--lime); }
    .brand { font-size: 32px; font-weight: 900; letter-spacing: -0.08em; }
    .avatar { display: grid; width: 42px; height: 42px; place-items: center; flex: 0 0 auto; overflow: hidden; border: 2px solid var(--surface); border-radius: 50%; color: var(--deep); background: var(--lime); font-weight: 800; }
    .avatar--lg { width: 64px; height: 64px; font-size: 22px; }
    .avatar-stack { display: flex; align-items: center; padding-left: 8px; }
    .avatar-stack .avatar { margin-left: -8px; }
    .badge { display: inline-flex; align-items: center; min-height: 24px; padding: 4px 8px; border-radius: 999px; color: var(--yellow); background: var(--deep); font-size: 12px; font-weight: 800; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: var(--danger); }
    .banner { padding: 12px; border-radius: 18px; color: var(--ink-muted); background: #F2F5DD; line-height: 1.45; }
    .banner--warn { color: var(--warn); background: #FFF6EA; }
    .banner--danger { color: var(--danger); background: #FFD9D2; }
    .tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .shortcut { display: grid; min-height: 104px; place-items: center; gap: 6px; padding: 12px; border: 1px solid var(--border); border-radius: 18px; color: var(--deep); background: var(--surface); font-weight: 800; text-align: center; }
    .post-frame, .photo-frame { display: grid; min-height: 176px; place-items: center; border-radius: 18px; color: var(--ink-muted); background: #E8EFC7; }
    .photo-frame { min-height: 90px; color: var(--surface); background: #657D39; }
    .category-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .message { max-width: 82%; padding: 10px 12px; border-radius: 18px 18px 18px 4px; color: var(--ink); background: #F2F5DD; line-height: 1.45; }
    .message--me { margin-left: auto; border-radius: 18px 18px 4px 18px; color: var(--ink); background: var(--lime); }
    .start-screen { justify-content: flex-end; color: var(--surface); background: linear-gradient(180deg, rgba(253,253,243,.14), rgba(38,42,14,.86)), #657D39; }
    .start-screen .subtle, .start-screen .button--ghost { color: var(--surface); }
    .start-screen .button--ghost { border-color: rgba(253,253,243,.72); }
    .start-hero { display: grid; min-height: 390px; place-items: center; align-content: center; gap: 12px; text-align: center; }
    .home-hero { display: grid; min-height: 220px; place-items: center; border-radius: var(--card-radius); color: var(--deep); background: #E8EFC7; text-align: center; }
    .spark { display: flex; height: 48px; align-items: end; gap: 4px; }
    .spark span { width: 12px; border-radius: 999px 999px 2px 2px; background: var(--deep); }
    .metric-grid-four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; overflow: hidden; border: 1px solid var(--border); border-radius: 18px; }
    .metric-grid-four .metric { border-radius: 0; background: var(--surface); }
    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .photo-grid button { min-height: 92px; border: 0; border-radius: 10px; color: var(--surface); background: #657D39; }
    @media (max-width: 700px) { .prototype-frame { display: flex; flex-direction: column; width: 100%; margin: 0; } #app { order: 1; min-height: 100vh; border: 0; border-radius: 0; } #review-panel { order: 2; position: static; margin: 12px; } }
  </style>
</head>
<body>
  <!-- THESIS: approval-first mobile prototype; refuses generic dashboard chrome. OWN-WORLD: established olive, lime, cream tokens, tactile cards, and dense operating controls. STORY: team members inspect approved screens, actions, and role visibility without a server. FIRST VIEWPORT: 390px app shell shows start screen while review controls stay beside it. FORM: established mobile product language, seed inherited. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md. -->
  <div class="prototype-frame">
    <aside id="review-panel"></aside>
    <main id="app"></main>
    <div id="sheet-root"></div>
  </div>
  <script>
    'use strict'

    const state = { currentScreenId: '1-1', history: ['1-1'], role: '크루원', viewState: '기본', sheet: null, invitePreview: false, resetSent: false, pickupCount: 1, profileTab: '기록', feedTab: '전체' }
    const mock = { crew: '한강줍깅크루', leader: '관열', member: '민지', post: '오늘 아침 한강을 걸으며 플로깅했어요.', activity: '여의도 한강공원 아침 활동' }
    const app = document.getElementById('app')
    const reviewPanel = document.getElementById('review-panel')
    const sheetRoot = document.getElementById('sheet-root')

    function element(tag, options = {}, children = []) {
      const node = document.createElement(tag)
      if (options.className) node.className = options.className
      if (options.text !== undefined) node.textContent = options.text
      if (options.type) node.type = options.type
      if (options.role) node.setAttribute('role', options.role)
      if (options.ariaLabel) node.setAttribute('aria-label', options.ariaLabel)
      if (options.ariaPressed !== undefined) node.setAttribute('aria-pressed', String(options.ariaPressed))
      if (options.ariaCurrent) node.setAttribute('aria-current', options.ariaCurrent)
      if (options.selected !== undefined) node.selected = options.selected
      if (options.onClick) node.addEventListener('click', options.onClick)
      children.filter(Boolean).forEach((child) => node.append(child))
      return node
    }

    function button(label, onClick, variant = 'primary') { return element('button', { className: `button button--${variant}`, text: label, type: 'button', onClick }) }
    function iconButton(label, onClick) { return element('button', { className: 'icon-button', text: '‹', type: 'button', ariaLabel: label, onClick }) }
    function card(children = []) { return element('section', { className: 'card' }, children) }
    function text(tag, value, className = '') { return element(tag, { text: value, className }) }
    function avatar(name, size = '') { return element('span', { className: `avatar ${size ? `avatar--${size}` : ''}`, text: name.slice(0, 1), ariaLabel: name }) }
    function avatarStack(names) { return element('div', { className: 'avatar-stack', ariaLabel: `${names.join(', ')} 프로필` }, names.map((name) => avatar(name))) }
    function badge(value) { return element('span', { className: 'badge', text: value }) }
    function banner(value, tone = '') { return element('section', { className: `banner${tone ? ` banner--${tone}` : ''}`, text: value }) }
    function photoFrame(label = '사진 미리보기') { return element('div', { className: 'photo-frame', text: label }) }
    function categoryChips(values) { return element('div', { className: 'category-chips' }, values.map((value) => element('span', { className: 'chip', text: value }))) }
    function categoryGrid() {
      return element('div', { className: 'tile-grid' }, ['담배꽁초', '캔', '플라스틱', '종이', '유리', '비닐', '일반'].map((name, index) => card([text('strong', name), text('p', index === 1 ? 'AI · 1개' : index === 2 ? '확인 필요 · 2개' : '0개', 'caption'), element('div', { className: 'button-row' }, [button('−', () => {}, 'ghost'), button('+', () => {}, 'soft')])])))
    }
    function recordMetrics(values = [['27', '개수'], ['42분', '시간'], ['3.1km', '거리']]) { return element('div', { className: 'metrics' }, values.map(([value, label]) => element('div', { className: 'metric' }, [text('strong', value), text('span', label, 'caption')]))) }
    function stack(children = [], className = 'stack') { return element('div', { className }, children) }
    function field(labelText, value = '', type = 'text') {
      const input = element(type === 'textarea' ? 'textarea' : 'input', { className: 'field', type })
      if (type !== 'textarea') input.value = value
      else input.value = value
      input.setAttribute('aria-label', labelText)
      return element('label', {}, [text('span', labelText), input])
    }
    function listRow(title, subtitle, onClick) {
      const words = stack([text('strong', title), subtitle ? text('span', subtitle, 'caption') : null], 'tight')
      return element('button', { className: 'list-row', type: 'button', role: 'button', onClick }, [words, text('span', '›')])
    }
    function leaderOnly(node) { return state.role === '크루장' ? node : null }
    function statePanel() {
      if (state.viewState === '기본') return null
      const message = { '로딩': '내용을 불러오는 중이에요.', '빈': '아직 표시할 내용이 없어요.', '오류': '문제가 생겼어요. 다시 시도해 주세요.', '오프라인': '인터넷 연결을 확인해 주세요.', '권한 거부': '권한을 허용하면 이 기능을 사용할 수 있어요.', '제출 중': '처리 중이에요. 잠시만 기다려 주세요.' }[state.viewState]
      const tone = state.viewState === '오류' ? ' state-panel--error' : state.viewState === '오프라인' ? ' state-panel--offline' : ''
      return element('section', { className: `state-panel${tone}`, text: message })
    }
    function page(title, description, children = [], options = {}) {
      const isTabRoot = ['2-1', '5-1', '4-1', '3-1', '5-5'].includes(state.currentScreenId)
      const header = element('header', { className: 'screen-header' }, [options.back === false || isTabRoot ? text('span', '') : iconButton('뒤로', back), stack([text('h1', title), description ? text('p', description) : null], 'tight'), options.action || text('span', '')])
      const screen = element('section', { className: 'screen' }, [header, statePanel(), ...children])
      return screen
    }
    function tabs(labels, selected = labels[0], onChange = () => {}) { return element('div', { className: 'tabs' }, labels.map((label) => element('button', { text: label, type: 'button', ariaPressed: selected === label, onClick: () => onChange(label) }))) }
    function metrics() { return element('div', { className: 'metrics' }, [['거리', '2.8km'], ['시간', '41분'], ['줍기', '17개']].map(([label, value]) => element('div', { className: 'metric' }, [text('strong', value), text('span', label, 'caption')]))) }
    function mapPlaceholder(label = '활동 경로 미리보기') { return element('div', { className: 'map-placeholder', text: label }) }
    function confirmSheet(title, body, action, label = '확인') { openSheet('confirm', { title, body, action, label }) }

    function navigate(id, options = {}) {
      if (!screenById.has(id)) return
      if (options.replace) state.history[state.history.length - 1] = id
      else state.history.push(id)
      state.currentScreenId = id
      state.viewState = '기본'
      state.sheet = null
      renderApp()
    }
    function back() {
      if (state.history.length > 1) state.history.pop()
      else state.history = ['1-1']
      state.currentScreenId = state.history[state.history.length - 1]
      state.viewState = '기본'
      state.sheet = null
      renderApp()
    }
    function openSheet(kind, data = {}) { state.sheet = { kind, data }; renderSheet() }
    function closeSheet() {
      state.sheet = null
      if (state.currentScreenId === '4-2') return navigate('4-1', { replace: true })
      if (state.currentScreenId === '4-6') return navigate('4-3', { replace: true })
      renderSheet()
    }

    function renderStart() {
      const hero = element('section', { className: 'screen start-screen' }, [
        stack([text('div', '가치줍깅', 'brand'), text('p', '크루와 함께 걸으며 줍는 사람들.\n기록하고, 나누고, 응원해요.', 'subtle')], 'start-hero'),
        state.viewState === '오류' ? banner('소셜 로그인에 실패했어요. 네트워크 상태를 확인하고 다시 시도해 주세요.', 'danger') : null,
        stack([
          button('카카오로 시작하기', () => navigate('1-4')), button('구글로 시작하기', () => navigate('1-4'), 'ghost'),
          button('이메일로 로그인', () => navigate('1-2'), 'soft'), button('처음이신가요? 회원가입', () => navigate('1-3'), 'ghost'),
        ]),
      ])
      return hero
    }
    function renderLogin() {
      return page('이메일 로그인', '기존 계정', [stack([
        text('div', '가치줍깅', 'brand'), text('h2', '다시 만나서 반가워요', 'display'), text('p', '가입한 이메일로 로그인하고\n오늘의 줍깅을 이어가요.', 'subtle'),
        field('이메일', 'you@example.com', 'email'), field('비밀번호', '', 'password'), button('비밀번호 보기', () => {}, 'ghost'),
        state.viewState === '오류' ? banner('이메일 또는 비밀번호가 올바르지 않아요.', 'danger') : null, button('로그인', () => navigate('2-1')),
        element('div', { className: 'button-row' }, [button('비밀번호를 잊으셨나요?', () => navigate('1-5'), 'ghost'), button('회원가입', () => navigate('1-3'), 'ghost')]),
      ])])
    }
    function renderSignup() {
      return page('회원가입', '', [stack([
        text('h2', '가치줍깅에 오신 걸 환영해요', 'display'), text('p', '이메일·비밀번호·닉네임을 입력해 주세요.', 'subtle'), field('이메일', 'you@example.com', 'email'), field('비밀번호', '', 'password'), field('닉네임', '새싹'),
        card([listRow('필수 약관 동의', '내용 보기', () => {}), listRow('필수 개인정보 동의', '내용 보기', () => {}), listRow('선택 동의 항목', '내용 보기', () => {})]), button('회원가입', () => navigate('1-6')), button('이미 계정이 있어요 · 로그인', () => navigate('1-2'), 'ghost'),
      ])])
    }
    function renderNickname() {
      return page('닉네임 설정', '', [stack([
        element('span', { className: 'chip', text: '프로필 만들기' }), text('h2', '어떻게 불러 드릴까요?', 'display'), text('p', '닉네임은 피드와 크루에서 보여요.', 'subtle'), field('닉네임', '새싹'),
        card([listRow('필수 약관 동의', '내용 보기', () => {}), listRow('필수 개인정보 동의', '내용 보기', () => {}), listRow('선택 동의 항목', '내용 보기', () => {})]), button('다음', () => navigate('1-6')),
      ])])
    }
    function renderPasswordReset() {
      if (state.resetSent) return page('비밀번호 재설정', '계정 복구', [stack([text('h2', '재설정 요청을 접수했어요', 'display'), text('p', '계정이 있으면 메일로 받은 코드를 확인해 주세요.', 'subtle'), button('코드 입력하기', () => openSheet('password-code')), button('메일 다시 보내기', () => {}, 'ghost')])])
      return page('비밀번호 재설정', '계정 복구', [stack([text('h2', '가입한 이메일을 알려 주세요', 'display'), field('이메일', 'you@example.com', 'email'), button('재설정 메일 보내기', () => { state.resetSent = true; renderApp() })])])
    }

    function renderReviewPanel(screen) {
      reviewPanel.replaceChildren()
      reviewPanel.append(text('h2', '검토 제어', 'review-title'), text('p', `${screen.id} · ${screen.name}`, 'caption'), text('p', screen.spec, 'caption'))
      const role = element('select', { className: 'review-select', ariaLabel: '역할 선택' })
      ;['크루원', '크루장'].forEach((value) => { const option = element('option', { text: value }); option.value = value; option.selected = state.role === value; role.append(option) })
      role.addEventListener('change', () => { state.role = role.value; renderApp() })
      const stateSelect = element('select', { className: 'review-select', ariaLabel: '상태 선택' })
      const screenStates = applicableStates[screen.id]
      if (!screenStates.includes(state.viewState)) state.viewState = '기본'
      screenStates.forEach((value) => { const option = element('option', { text: value }); option.value = value; option.selected = state.viewState === value; stateSelect.append(option) })
      stateSelect.addEventListener('change', () => { state.viewState = stateSelect.value; renderApp() })
      reviewPanel.append(role, stateSelect, button('전체 화면', () => openSheet('screens'), 'ghost'))
    }
    function renderBottomNav() { return element('nav', { className: 'nav', ariaLabel: '하단 탭' }, tabRoots.map(([label, id]) => element('button', { text: label, type: 'button', ariaCurrent: state.currentScreenId === id ? 'page' : null, onClick: () => navigate(id) }))) }
    function renderSheet() {
      sheetRoot.replaceChildren()
      if (!state.sheet) return
      const scrim = element('div', { className: 'sheet-scrim' })
      const dialog = element('section', { className: 'sheet', ariaLabel: '선택 시트' })
      dialog.setAttribute('role', 'dialog')
      dialog.setAttribute('aria-modal', 'true')
      if (state.sheet.kind === 'screens') {
        dialog.append(text('h2', '전체 화면', 'section-title'))
        const list = element('div', { className: 'screen-list' })
        screens.forEach((screen) => list.append(listRow(`${screen.id} ${screen.name}`, screen.spec, () => navigate(screen.id))))
        dialog.append(list)
      } else if (state.sheet.kind === 'password-code') {
        dialog.append(text('h2', '새 비밀번호 설정', 'section-title'), field('인증 코드', ''), field('새 비밀번호', '', 'password'), button('비밀번호 변경', () => { state.resetSent = false; closeSheet(); navigate('1-2', { replace: true }) }))
      } else if (state.sheet.kind === 'activity-start') {
        dialog.append(text('h2', '활동을 시작할까요?', 'section-title'), card([text('strong', '크루원에게 위치 공유'), text('p', '켜면 활동 중 내 위치와 경로가 크루원 지도에 보여요. 꺼도 내 기록에는 경로가 남아요.', 'subtle'), button('위치 공유 켬', () => {}, 'soft')]), banner('위치를 잡고 있어요…'), listRow('걸음수 측정 안 됨', '연결 · 선택', () => {}), text('p', '나를 팔로우한 크루원에게 시작 알림이 가요.', 'caption'), button('위치 권한 안내', () => navigate('1-10'), 'ghost'), button('줍깅 시작', () => navigate('4-3')))
      } else if (state.sheet.kind === 'quick-pickup') {
        dialog.append(text('h2', '이번 활동 줍기 17개', 'section-title'), text('p', '하나 담기 또는 수량을 입력하세요', 'subtle'), categoryGrid(), banner(`플라스틱 ${state.pickupCount}개 담았어요 · 저장됨`), button('되돌리기', () => { state.pickupCount = 0; renderSheet() }, 'ghost'), button('닫기', closeSheet))
      } else if (state.sheet.kind === 'camera-preview') {
        dialog.append(text('h2', '방금 찍은 사진', 'section-title'), photoFrame('촬영 사진 미리보기'), element('div', { className: 'button-row' }, [button('다시 찍기', closeSheet, 'ghost'), button('사용', () => navigate('4-5'))]))
      } else {
        const data = state.sheet.data
        dialog.append(text('h2', data.title || '안내', 'section-title'), text('p', data.body || '', 'subtle'))
        if (state.sheet.kind === 'confirm') dialog.append(element('div', { className: 'button-row' }, [button(data.label || '확인', () => { data.action(); closeSheet() }), button('취소', closeSheet, 'ghost')]))
      }
      dialog.append(button('닫기', closeSheet, 'ghost'))
      scrim.addEventListener('click', (event) => { if (event.target === scrim) closeSheet() })
      scrim.append(dialog)
      sheetRoot.append(scrim)
    }
    function renderApp() {
      const screen = screenById.get(state.currentScreenId) || screenById.get('1-1')
      app.replaceChildren(screen.render())
      if (tabRoots.some(([, id]) => id === screen.id)) app.firstElementChild.append(renderBottomNav())
      renderReviewPanel(screen)
      renderSheet()
    }
