<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가치줍깅 프로토타입</title>
  <style>
    :root {
      --bg: #DCE6A6;
      --surface: #FDFDF3;
      --ink: #262A0E;
      --ink-muted: #5C6142;
      --deep: #3D431F;
      --lime: #C9E345;
      --yellow: #F4F04B;
      --border: #DEE3BD;
      --danger: #C44343;
      --screen-padding: 20px;
      --min-touch: 48px;
      --nav-height: 68px;
      --card-radius: 26px;
      --sheet-radius: 30px;
      --shadow-card: 0 2px 8px rgba(101, 114, 28, 0.12);
      --shadow-overlay: 0 12px 32px rgba(101, 114, 28, 0.24);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button, input, select { min-height: var(--min-touch); }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid var(--deep);
      outline-offset: 2px;
    }
    .prototype-frame {
      display: grid;
      grid-template-columns: minmax(0, 390px) 260px;
      gap: 24px;
      width: min(100% - 32px, 700px);
      margin: 24px auto;
      align-items: start;
    }
    #app {
      min-height: 844px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 34px;
      box-shadow: var(--shadow-overlay);
    }
    #review-panel {
      position: sticky;
      top: 24px;
      min-height: 160px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow-card);
    }
    #sheet-root:empty { display: none; }
    .screen { min-height: 844px; padding: var(--screen-padding); }
    .screen-header, .list-row, .nav { display: flex; align-items: center; }
    .screen-header { gap: 8px; justify-content: space-between; margin-bottom: 20px; }
    .card { padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--card-radius); box-shadow: var(--shadow-card); }
    .button { width: 100%; border: 0; border-radius: 999px; padding: 12px 16px; font-weight: 700; }
    .button--primary { color: var(--ink); background: linear-gradient(90deg, var(--lime), var(--yellow)); }
    .button--soft { color: var(--ink); background: #F2F5DD; }
    .button--ghost { color: var(--deep); background: transparent; border: 1px solid var(--border); }
    .list-row { min-height: var(--min-touch); justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); }
    .field { width: 100%; padding: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
    .state-panel { padding: 12px; color: var(--ink-muted); background: #F2F5DD; border-radius: 18px; }
    .map-placeholder, .camera-placeholder { display: grid; min-height: 210px; place-items: center; border-radius: var(--card-radius); color: var(--surface); background: repeating-linear-gradient(45deg, #748a45 0 10px, #657d39 10px 20px); }
    .camera-placeholder { background: #22260F; }
    .nav { position: sticky; bottom: 0; justify-content: space-around; min-height: var(--nav-height); margin: 20px -20px -20px; padding: 8px; background: var(--surface); border-top: 1px solid var(--border); }
    .nav button { min-width: 48px; color: var(--ink-muted); background: transparent; border: 0; }
    .sheet-scrim { position: fixed; inset: 0; display: grid; align-items: end; background: rgba(38, 42, 14, 0.45); }
    .sheet { width: min(100%, 390px); margin: 0 auto; padding: 24px 20px; background: var(--surface); border-radius: var(--sheet-radius) var(--sheet-radius) 0 0; box-shadow: var(--shadow-overlay); }
    @media (max-width: 720px) {
      .prototype-frame { display: block; width: 100%; margin: 0; }
      #app { min-height: 100vh; border: 0; border-radius: 0; }
      #review-panel { position: static; margin: 12px; }
    }
  </style>
</head>
<body>
  <div class="prototype-frame">
    <aside id="review-panel"></aside>
    <main id="app"></main>
    <div id="sheet-root"></div>
  </div>
  <script>
    'use strict'

    const state = {
      currentScreenId: '1-1',
      history: ['1-1'],
      role: '크루원',
      viewState: '기본',
      sheet: null,
    }

    function element(tag, options = {}, children = []) {
      const node = document.createElement(tag)
      if (options.className) node.className = options.className
      if (options.text) node.textContent = options.text
      if (options.type) node.type = options.type
      if (options.ariaLabel) node.setAttribute('aria-label', options.ariaLabel)
      if (options.onClick) node.addEventListener('click', options.onClick)
      children.filter(Boolean).forEach((child) => node.append(child))
      return node
    }

    function button(label, onClick, variant = 'primary') {
      return element('button', { className: `button button--${variant}`, text: label, type: 'button', onClick })
    }

    function card(children = []) {
      return element('section', { className: 'card' }, children)
    }
  </script>
</body>
</html>
