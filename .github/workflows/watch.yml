# 바깥에서 공개 주소를 찌른다. 감시 두 겹 중 바깥쪽이다.
#
# 서버 안의 watch.sh 는 서버가 통째로 꺼지면 같이 죽어서 아무 말도 못 한다.
# 전원·네트워크가 나간 것을 잡으려면 우리 서버 밖에서 도는 것이 하나 있어야 하고,
# 이미 쓰는 GitHub Actions 가 그 조건을 만족한다(공개 레포라 분은 무료다).
#
# 외부 감시 서비스(UptimeRobot 등)를 쓰지 않는 이유는 가입에 이메일이 필요해서다.
# 정확도는 그쪽이 낫지만 5분 단위 지연은 3명 팀이 감당할 수 있다.
#
# 스케줄은 밀린다 — GitHub 가 큐를 뒤로 미루면 10~20분이 될 수 있다. 분 단위 정확도가
# 필요해지면 그때 외부 서비스로 옮긴다.
name: watch

on:
  schedule:
    - cron: '*/5 * * * *'   # 살아 있나
    - cron: '7 0 * * *'     # 인증서 (하루 한 번. 5분마다 보면 경고가 하루 288번 간다)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read   # 직전 실행의 결과를 읽어 상태로 쓴다

# 스케줄이 밀려 직전 실행이 아직 도는 중이면 conclusion 이 비어서, 지금 실행이 그 실패를
# 보지 못하고 다운 알림을 한 번 더 보낸다. 겹치지 않게 막는다.
concurrency:
  group: watch

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOOK: ${{ secrets.MM_WEBHOOK_URL }}
      BASE: https://www.gachijoopging.site
    steps:
      - name: 공개 주소
        id: ping
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          say() {
            # username override 는 이 워크스페이스에서 꺼져 있어 무시된다. 머리말 이모지로 구별한다.
            jq -nc --arg t "$1" '{text:$t}' \
              | curl -sS -f -X POST -H 'Content-Type: application/json' -d @- "$HOOK" >/dev/null
          }

          # 한 번 실패했다고 바로 알리지 않는다. 배포 중 재기동과 구분이 안 되기 때문이다.
          code=000
          for _ in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/actuator/health" || echo 000)
            [ "$code" = 200 ] && break
            sleep 20
          done

          # 러너는 매번 새로 뜨므로 상태를 들고 있을 수 없다. 직전 실행의 성패를 상태로 쓴다.
          # 이게 없으면 서버가 꺼져 있는 동안 5분마다 같은 알림이 간다 — watch.sh 가
          # 피하려고 만든 "알림을 무시하는 습관" 을 바깥쪽이 그대로 만든다.
          prev=$(gh run list --repo "$REPO" -w watch.yml -L 2 --json conclusion -q '.[1].conclusion' || echo '')
          echo "직전 실행: ${prev:-없음} · 지금 HTTP $code"

          if [ "$code" != 200 ]; then
            if [ "$prev" != failure ]; then
              say ":rotating_light: **바깥에서 안 보인다** — \`$BASE/actuator/health\` 가 3회 연속 HTTP $code. 서버 전원·네트워크·Nginx 를 본다."
            else
              echo "직전에도 실패였다 — 다시 알리지 않는다"
            fi
            # 실패로 끝내야 다음 실행이 이 상태를 읽는다. GitHub 의 실패 알림은
            # 웹훅이 죽었을 때를 위한 두 번째 통로이기도 하다.
            exit 1
          fi

          if [ "$prev" = failure ]; then
            say ":white_check_mark: **바깥에서 다시 보인다** — $BASE"
          fi
          echo "health 200"

      # certbot 은 만료 30일 전부터 갱신을 시도한다. 5분마다 보면 갱신이 하루만 늦어도
      # 채널이 경고로 뒤덮인다. 하루 한 번이면 충분하다 — 남은 날이 분 단위로 줄지 않는다.
      #
      # 이 단계는 절대 실패로 끝내지 않는다. 실행 전체의 성패가 위 헬스체크의 상태이기 때문이다.
      # 여기서 exit 1 을 하면 다음 5분 실행이 prev=failure 를 보고, 장애가 없었는데도
      # "✅ 다시 보인다" 를 보낸다. 거짓 복구 알림이 쌓이면 ✅ 를 안 보게 된다.
      - name: 인증서
        if: github.event.schedule == '7 0 * * *' || github.event_name == 'workflow_dispatch'
        env:
          CERT_WARN_DAYS: '30'
        run: |
          set -uo pipefail

          say() {
            jq -nc --arg t "$1" '{text:$t}' \
              | curl -sS -f -X POST -H 'Content-Type: application/json' -d @- "$HOOK" >/dev/null || true
          }

          # Let's Encrypt 가 만료를 알려 주지 않으므로(2025-06-04 발송 중단) 직접 센다.
          # 자동 갱신이 조용히 실패하면 만료일에 브라우저가 사이트를 막는다.
          end=$(echo | openssl s_client -servername www.gachijoopging.site \
                -connect www.gachijoopging.site:443 2>/dev/null \
                | openssl x509 -noout -enddate | cut -d= -f2)

          if [ -z "$end" ]; then
            say ":warning: **인증서를 읽지 못했다** — 바깥에서 443 을 본다."
            exit 0
          fi

          left=$(( ( $(date -u -d "$end" +%s) - $(date -u +%s) ) / 86400 ))
          echo "인증서 ${left}일 남음 ($end)"

          if [ "$left" -le "$CERT_WARN_DAYS" ]; then
            say ":warning: **인증서 ${left}일 남음** ($end). 자동 갱신이 멈춘 것인지 본다 — \`docker compose logs certbot\`."
          fi
