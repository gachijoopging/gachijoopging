# Mattermost 로 보내는 것은 셋뿐이다 (conventions.md §알림).
#   1. dev 에 반영됨   2. main 에 반영됨(=배포)   3. 리뷰어 지정
# 그 외(작업 브랜치 푸시·PR 열림·승인·댓글)는 보내지 않는다. 3명 채널에서 노이즈가 된다.
# 이건 검사가 아니다 — 실패해도 PR 을 막지 않는다.
name: notify-mattermost

on:
  push:
    branches: [dev, main]
  pull_request:
    types: [review_requested]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 메시지 만들기
        id: msg
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          SUBJECT: ${{ github.event.head_commit.message }}
          PUSHER: ${{ github.event.head_commit.author.name }}
          COMPARE: ${{ github.event.compare }}
          REVIEWER: ${{ github.event.requested_reviewer.login }}
          NUM: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # 커밋 메시지 첫 줄만. squash 머지는 본문이 길다
            HEAD_LINE=$(printf '%s' "$SUBJECT" | head -n 1)
            if [ "$BRANCH" = "main" ]; then
              TEXT=":rocket: **main 배포** — ${HEAD_LINE}
${PUSHER} · [변경 내역](${COMPARE})"
            else
              TEXT=":arrows_counterclockwise: **dev 반영** — ${HEAD_LINE}
${PUSHER} · [변경 내역](${COMPARE})"
            fi
          elif [ -n "$REVIEWER" ]; then
            TEXT=":eyes: **@${REVIEWER} 리뷰 요청** — PR #${NUM}
[${TITLE}](${PR_URL}) · @${AUTHOR}"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "text<<__EOF__"
            echo "$TEXT"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: 보내기
        if: steps.msg.outputs.skip != 'true'
        env:
          HOOK: ${{ secrets.MM_WEBHOOK_URL }}
          TEXT: ${{ steps.msg.outputs.text }}
        run: |
          jq -nc --arg t "$TEXT" '{text:$t}' \
            | curl -sS -f -X POST -H 'Content-Type: application/json' -d @- "$HOOK"
