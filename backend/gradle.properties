# COMPAT = JDK 18+ 의 "네이티브 인코딩을 쓴다". UTF-8 로 못박지 않는 이유가 있다.
# Gradle 은 테스트 워커의 클래스패스를 @argfile 로 넘기면서 그 파일을 데몬의 기본
# charset 으로 쓰는데, JVM 런처는 그 파일을 sun.jnu.encoding 으로 읽는다. 둘을 UTF-8 로
# 고정하면 한글이 든 경로(= 한글 브랜치 이름으로 만든 워크트리)에서 어긋나 클래스패스가
# 깨지고, 테스트 387개가 전부 ClassNotFoundException 이 된다.
# COMPAT 은 쓰는 쪽과 읽는 쪽을 항상 일치시킨다 — Windows 는 MS949, CI 의
# gradle:8.10-jdk21 은 native.encoding 이 UTF-8 이라 CI 동작은 바뀌지 않는다.
org.gradle.jvmargs=-Dfile.encoding=COMPAT -Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
