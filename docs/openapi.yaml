openapi: 3.0.3

info:
  title: 가치줍깅 API
  version: 3.0.0
  description: |
    앱과 백엔드 사이 HTTP 계약의 유일한 정본. 실시간(채팅·위치)은 `realtime.md`.
    화면마다 필요한 데이터는 `screens.md`, 테이블은 `ERD.md`, 결정은 `feature-scope.md`, 용어는 `../CONTEXT.md`.

    ### 공통 규약 (옛 계약 2.3 을 이어받음)
    - 성공은 `{ "data": … }` 봉투, 오류는 `{ "code", "message", "requestId" }`
    - 시간은 ISO-8601 UTC `Z` 고정. 날짜만 필요한 곳은 `YYYY-MM-DD`
    - 앱이 UUID 를 만드는 리소스(미디어·활동·줍기·게시물·댓글·채팅·신고)는 같은 id 재전송 시 200 으로 흡수(멱등)
    - 목록은 `{ items, nextCursor }`. limit 기본 20·최대 50. 예외(배열 그대로): 크루원 목록 · 차단 목록 · 활동 중인 크루원 · 알림 처리 대기
    - 차단·공개 범위 필터링은 서버 책임. 차단은 한 방향으로 차단자의 개인 게시물·댓글·채팅·위치 조회에서 대상만 숨긴다. 공식 공지와 필요한 크루장 관리 정보는 유지한다
    - 닉네임·크루 이름은 앞뒤 공백과 줄바꿈을 제거한 뒤 기존 길이·저장 시 중복 검사를 적용한다. 비밀번호는 변형하지 않는다
    - 걸음수는 선택이며 권한·측정값 부재나 비보행 활동은 시작·기록·종료를 막지 않는다. 일시정지 걸음수는 제외하며 사용할 수 없는 0/null로 GPS를 보정하지 않는다
    - 활동 중 또는 계정별 로컬 미동기화 활동이 있으면 앱은 로그아웃·크루 나가기·회원 탈퇴를 막고 데이터를 보존한다. 서버는 진행 중 활동 충돌을 409 CONFLICT로 거절한다

    ### 남은 설계 계약 의존성
    - 가입 완료 전 필수/선택 약관·개인정보 동의를 구분한다. 실제 전문·버전·동의 저장/조회 계약은 미정이며 아래 가입/프로필 계약만으로 가입 완료를 구현할 수 없다. 임의 동의 필드는 정의하지 않는다
    - profileComplete는 닉네임 설정 완료만 나타내며 동의 완료를 뜻하지 않는다
    - 카테고리 7종: CIGARETTE·CAN·PLASTIC·PAPER·GLASS·VINYL·GENERAL
    - 입력 상한: 게시물 1000자 · 댓글 500자 · 채팅 500자 · 소개 200자 · 공지 제목 100자·본문 3000자 · 크루 이름 2~20자 · 닉네임 2~12자. 초과는 422
    - 모든 `example` 은 앱 목 데이터의 원본이다. 진행 순서 2단계는 이 예시로 화면을 완성한다

    ### 권한
    - `bearerAuth` 필수. 예외는 `/auth/*` 일부
    - 크루 범위 경로(`/crew/...`)는 **호출자의 소속 크루** 를 대상으로 한다. 크루 id 를 경로에 넣지 않는다 — 한 사람 한 크루(Q22)
    - 크루장 전용은 summary 에 `[크루장]`. 크루원이 부르면 403 FORBIDDEN
    - 소속 크루가 없는 사용자가 `/crew/...` 를 부르면 403 NO_CREW → 앱은 크루 만들기/가입하기(1-6)로

    ### 토큰
    - accessToken 1시간 · refreshToken 30일 · refresh 회전. 옛 계약과 같다

servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: www.gachi-joopging.site

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: me
  - name: crew
  - name: members
  - name: activities
  - name: media
  - name: posts
  - name: notices
  - name: chat
  - name: notifications
  - name: reports
  - name: stats

paths:
  # ───────────────────────── auth ─────────────────────────
  /auth/signup:
    post:
      tags: [auth]
      security: []
      summary: 이메일 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, nickname]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                nickname: { type: string, minLength: 2, maxLength: 12 }
      responses:
        '201': { $ref: '#/components/responses/TokenPair' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: 이메일 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/kakao:
    post:
      tags: [auth]
      security: []
      summary: 카카오 로그인
      requestBody: { $ref: '#/components/requestBodies/SocialToken' }
      responses:
        '200': { $ref: '#/components/responses/TokenPair' }
  /auth/google:
    post:
      tags: [auth]
      security: []
      summary: 구글 로그인
      requestBody: { $ref: '#/components/requestBodies/SocialToken' }
      responses:
        '200': { $ref: '#/components/responses/TokenPair' }
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      summary: 토큰 회전
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 이 기기의 refreshToken 무효화
      description: 진행 중 활동은 409 CONFLICT. 로컬 미동기화 활동은 앱이 먼저 차단한다
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { refreshToken: { type: string } }
      responses:
        '204': { description: 완료 }
        '409': { $ref: '#/components/responses/Error' }

  /auth/password-reset:
    post:
      tags: [auth]
      security: []
      summary: 재설정 메일 발송
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '204': { description: 존재 여부와 무관하게 204 }
  /auth/password-reset/confirm:
    post:
      tags: [auth]
      security: []
      summary: 코드로 새 비밀번호 설정
      description: 성공하면 모든 기기의 access/refresh 세션을 무효화하고 다시 로그인한다. 소셜 전용 계정에는 비밀번호를 새로 만들지 않는다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email: { type: string }
                code: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204': { description: 완료 }
        '422': { $ref: '#/components/responses/Error' }

  # ───────────────────────── me ─────────────────────────
  /users/me:
    get:
      tags: [me]
      summary: 내 정보 + 소속 상태 — 앱 진입 분기(1-6/1-9/탭)의 근거
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
              example:
                data:
                  id: 6f1c…
                  nickname: 관열
                  intro: 한강 서쪽 담당
                  photoUrl: https://cdn…/p/6f1c.jpg
                  email: kwan@example.com
                  profileComplete: true
                  hasPassword: true
                  linked: { kakao: true, google: false }
                  settings: { shareLocationDefault: true, notifyActivityStart: true }
                  membership:
                    status: MEMBER
                    crew: { id: c001, name: 한강줍깅크루, isLeader: true }
    patch:
      tags: [me]
      summary: 프로필·설정 수정
      description: 미완료 소셜 가입은 닉네임만 저장한다. 저장 성공 시 profileComplete=true. 사진은 이후 선택이다
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, minLength: 2, maxLength: 12 }
                intro: { type: string, maxLength: 200 }
                photoMediaId: { type: string, format: uuid, nullable: true }
                shareLocationDefault: { type: boolean }
                notifyActivityStart: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Me' } } }
              example:
                data:
                  id: 9c2f…
                  nickname: 새싹줍깅러
                  intro: ''
                  photoUrl: null
                  email: null
                  profileComplete: true
                  hasPassword: false
                  linked: { kakao: true, google: false }
                  settings: { shareLocationDefault: true, notifyActivityStart: true }
                  membership:
                    status: NONE
                    crew: null
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [me]
      summary: 회원 탈퇴 — 다른 크루원이 있으면 크루장은 먼저 위임
      description: 혼자 남은 크루장은 해산 확인 뒤 탈퇴 가능. 진행 중 활동은 409 CONFLICT. 로컬 미동기화 활동은 앱이 차단한다
      responses:
        '204': { description: 완료 }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /users/me/activities:
    get:
      tags: [me, activities]
      summary: 내 전체 활동 기록 — 이전 크루 포함, 소속 없어도 조회
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/ActivityPage' }
  /users/me/stats:
    get:
      tags: [me, stats]
      summary: 내 누적 기록·달력 — 이전 크루 포함, 소속 없어도 조회
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/MemberStats' } } }
  /users/me/social:
    put:
      tags: [me]
      summary: 이메일 계정에 소셜 연결 — 옛 계약 유지
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token]
              properties:
                provider: { type: string, enum: [KAKAO, GOOGLE] }
                token: { type: string }
      responses:
        '204': { description: 완료 }
  /users/me/devices:
    put:
      tags: [me]
      summary: 푸시 토큰 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken, platform]
              properties:
                pushToken: { type: string }
                platform: { type: string, enum: [ANDROID] }
      responses:
        '204': { description: 완료 }
  /users/me/blocked:
    get:
      tags: [me]
      summary: 차단 목록 (배열)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/UserBrief' } }
  /users/{userId}/block:
    put:
      tags: [me]
      summary: 차단
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses: { '204': { description: 완료 } }
    delete:
      tags: [me]
      summary: 차단 해제
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses: { '204': { description: 완료 } }
  /users/{userId}/follow:
    put:
      tags: [me]
      summary: 팔로우 — 활동 시작 알림 대상 지정. 상대에게 보이지 않음
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses: { '204': { description: 완료 } }
    delete:
      tags: [me]
      summary: 팔로우 해제
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses: { '204': { description: 완료 } }

  # ───────────────────────── crew (소속) ─────────────────────────
  /crews:
    post:
      tags: [crew]
      summary: 크루 만들기 — 이름만. 호출자가 크루장. 이미 소속이면 409
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, minLength: 2, maxLength: 20 } }
      responses:
        '201':
          description: 생성
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Crew' } } }
              example: { data: { id: c001, name: 한강줍깅크루, intro: '', photoUrl: null, leader: { id: u001, nickname: 관열, photoUrl: null, withdrawn: false }, memberCount: 1, goalCount: 300, inviteCode: HG-7K2P, pendingJoinRequests: 0, pinnedNotice: null, unreadChat: 0, isLeader: true } }
        '409': { $ref: '#/components/responses/Error' }
  /crews/preview:
    get:
      tags: [crew]
      summary: 초대 코드로 크루 이름 미리 보기 (1-8)
      parameters:
        - in: query
          name: inviteCode
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      memberCount: { type: integer }
                      photoUrl: { type: string, nullable: true }
                      intro: { type: string }
                      leader: { $ref: '#/components/schemas/UserBrief' }
              example: { data: { id: c001, name: 한강줍깅크루, memberCount: 18, photoUrl: null, intro: 매주 토요일 아침 여의도, leader: { id: u001, nickname: 관열, photoUrl: null, withdrawn: false } } }
        '404': { $ref: '#/components/responses/Error' }
  /crews/join-requests:
    post:
      tags: [crew]
      summary: 초대 코드로 가입 신청 — 대기 중이면 200 으로 흡수
      description: 거절·추방 뒤에도 현재 유효 코드로 재신청할 수 있다
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [inviteCode], properties: { inviteCode: { type: string } } }
      responses:
        '201':
          description: 신청됨
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/JoinRequest' } } }
              example: { data: { id: jr001, crew: { id: c001, name: 한강줍깅크루 }, user: { id: u001, nickname: 관열, photoUrl: null, withdrawn: false }, status: PENDING, createdAt: 2026-09-15T10:00:00Z } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /crews/join-requests/mine:
    get:
      tags: [crew]
      summary: 내 신청 상태 (1-9 승인 대기)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { anyOf: [{ $ref: '#/components/schemas/JoinRequest' }, { type: object, nullable: true, enum: [null] }] } } }
              example: { data: { id: jr001, crew: { id: c001, name: 한강줍깅크루 }, user: { id: u001, nickname: 관열, photoUrl: null, withdrawn: false }, status: PENDING, createdAt: 2026-09-15T10:00:00Z } }
    delete:
      tags: [crew]
      summary: 신청 취소
      responses: { '204': { description: 완료 } }

  /crew:
    get:
      tags: [crew]
      summary: 내 크루 정보 (3-1, 3-2)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Crew' } } }
              example:
                data:
                  id: c001
                  name: 한강줍깅크루
                  intro: 매주 토요일 아침 여의도
                  photoUrl: null
                  leader: { id: 6f1c…, nickname: 관열, photoUrl: null, withdrawn: false }
                  memberCount: 18
                  goalCount: 300
                  inviteCode: HG-7K2P
                  pendingJoinRequests: 2
                  pinnedNotice: { id: n01, title: 9월 정기 활동 안내, createdAt: 2026-09-01T09:00:00Z }
                  unreadChat: 5
                  isLeader: true
    patch:
      tags: [crew]
      summary: "[크루장] 이름·소개·사진·목표 수정 (3-10)"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                intro: { type: string, maxLength: 200 }
                photoMediaId: { type: string, format: uuid, nullable: true }
                goalCount: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Crew' } } }
              example:
                data:
                  id: c001
                  name: 한강줍깅크루
                  intro: 매주 토요일 아침 여의도
                  photoUrl: null
                  leader: { id: 6f1c…, nickname: 관열, photoUrl: null, withdrawn: false }
                  memberCount: 18
                  goalCount: 300
                  inviteCode: HG-7K2P
                  pendingJoinRequests: 2
                  pinnedNotice: { id: n01, title: 9월 정기 활동 안내, createdAt: 2026-09-01T09:00:00Z }
                  unreadChat: 5
                  isLeader: true
  /crew/invite-code:
    post:
      tags: [crew]
      summary: "[크루장] 초대 코드 재발급 — 옛 코드의 신규 신청만 무효"
      description: 기존 대기 신청은 보존한다
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { inviteCode: { type: string } } } } }
              example:
                data: { inviteCode: HG-9QX4 }
  /crew/leave:
    post:
      tags: [crew]
      summary: 크루 나가기 — 다른 크루원이 있으면 크루장은 403 LEADER_MUST_DELEGATE
      description: 혼자 남은 크루장은 해산 확인 뒤 가능. 진행 중 활동은 409 CONFLICT. 로컬 미동기화 활동은 앱이 차단한다. 내 기록은 보존한다
      responses:
        '204': { description: 완료 }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /crew/members:
    get:
      tags: [members]
      summary: 크루원 목록 (배열)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Member' } }
              example:
                data:
                  - { id: 6f1c…, nickname: 관열, photoUrl: null, withdrawn: false, isLeader: true, totalItems: 412, joinedAt: 2026-09-01T00:00:00Z, following: false }
                  - { id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false, isLeader: false, totalItems: 380, joinedAt: 2026-09-02T00:00:00Z, following: true }
  /crew/members/{userId}:
    get:
      tags: [members]
      summary: 타인 프로필 (5-4) — 차단한 사람은 404
      description: 현재 소속 크루의 활동을 locationShared와 무관하게 합산한다. 본인의 이전 크루 포함 합산은 /users/me/stats
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/MemberProfile' } } }
    delete:
      tags: [members]
      summary: "[크루장] 추방"
      description: 대상의 현재 크루 내 PENDING USER 신고를 함께 RESOLVED 처리하고 각 신고자에게 REPORT_RESOLVED 결과 알림을 보낸다
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses: { '204': { description: 완료 } }
  /crew/members/{userId}/activities:
    get:
      tags: [members]
      summary: 현재 크루원의 활동 목록 (5-4 기록 탭)
      description: 현재 같은 크루의 활동 메타데이터·사진은 locationShared와 무관하게 조회한다. locationShared=false면 경로만 숨긴다. 본인의 이전 크루 포함 기록은 /users/me/activities를 쓴다
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/ActivityPage' }
  /crew/members/{userId}/posts:
    get:
      tags: [members]
      summary: 그 크루원의 크루 공개 게시물 (5-4 게시물 탭). 본인이면 나만 보기 포함
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/PostPage' }
  /crew/leader:
    put:
      tags: [members]
      summary: "[크루장] 위임"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId], properties: { userId: { type: string } } }
      responses: { '204': { description: 완료 } }
  /crew/join-requests:
    get:
      tags: [members]
      summary: "[크루장] 대기 중인 가입 신청 (배열)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } }
              example:
                data:
                  - { id: jr002, crew: { id: c001, name: 한강줍깅크루 }, user: { id: 9b3e…, nickname: 지수, photoUrl: null, withdrawn: false }, status: PENDING, createdAt: 2026-09-02T09:00:00Z }
                  - { id: jr003, crew: { id: c001, name: 한강줍깅크루 }, user: { id: 7c4f…, nickname: 민수, photoUrl: null, withdrawn: false }, status: PENDING, createdAt: 2026-09-01T09:00:00Z }
  /crew/join-requests/{requestId}:
    post:
      tags: [members]
      summary: "[크루장] 승인·거절"
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [APPROVE, REJECT] } } }
      responses: { '204': { description: 완료 } }

  # ───────────────────────── activities ─────────────────────────
  /activities:
    post:
      tags: [activities]
      summary: 활동 시작 — 같은 UUID 재전송은 200
      description: 다른 UUID의 진행 중 활동은 409 CONFLICT. 앱은 이전 로컬 종료/줍기 대기가 동기화될 때까지 새 시작을 차단한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, startedAt, locationShared]
              properties:
                id: { type: string, format: uuid, description: 앱 생성 }
                startedAt: { type: string, format: date-time }
                locationShared: { type: boolean }
      responses:
        '201':
          description: 시작
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Activity' } } }
              example:
                data:
                  id: 2b7e4c1a-9f3d-4e8b-a6c2-5d1f0e9b8a73
                  status: IN_PROGRESS
                  startedAt: '2026-09-29T09:00:00+09:00'
                  endedAt: null
                  durationSec: 0
                  pausedSec: 0
                  paused: false
                  pausedAt: null
                  distanceM: 0
                  steps: null
                  locationShared: true
                  itemCount: 0
                  byCategory: {}
        '200':
          description: 같은 UUID의 활동을 돌려준다
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Activity' } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /activities/current:
    get:
      tags: [activities]
      summary: 내 진행 중 활동 — 앱 재실행 때 이어받기 (4-1)
      responses:
        '200':
          description: 없으면 data null
          content:
            application/json:
              schema: { type: object, properties: { data: { anyOf: [{ $ref: '#/components/schemas/Activity' }, { type: object, nullable: true, enum: [null] }] } } }
              example:
                data: null
  /activities/{id}/pause:
    post:
      tags: [activities]
      summary: 일시정지 — 거리·시간·걸음수 누적 정지 (Q30)
      description: paused=true, pausedAt 저장. IN_PROGRESS 유지, 위치 공유와 줍기는 계속 가능. 재전송은 현재 상태 유지
      parameters: [{ $ref: '#/components/parameters/ActivityId' }]
      responses: { '204': { description: 완료 } }
  /activities/{id}/resume:
    post:
      tags: [activities]
      summary: 재개
      description: paused=false, pausedAt=null로 갱신하고 일시정지 누적 시간을 반영한다. 재전송은 중복 가산하지 않는다
      parameters: [{ $ref: '#/components/parameters/ActivityId' }]
      responses: { '204': { description: 완료 } }
  /activities/{id}/items:
    post:
      tags: [activities]
      summary: 줍기 추가 — 빠른 줍기(photoId 없음) 또는 AI 확인 뒤 저장(photoId 있음). 여러 건 한 번에
      description: 앱은 UUID를 즉시 로컬 영속 저장 후 전송한다. 5초 배치 대기 없음. 되돌리기는 미전송 건 취소 또는 저장된 동일 UUID DELETE. 종료 요청보다 먼저 큐를 동기화한다
      parameters: [{ $ref: '#/components/parameters/ActivityId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                photoId: { type: string, format: uuid, nullable: true, description: 4-5 에서 온 경우 }
                items:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/ItemInput' }
            example:
              photoId: null
              items: [{ id: 00000000-0000-4000-8000-000000000001, category: CIGARETTE, quantity: 3 }]
      responses:
        '200':
          description: 갱신된 요약
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/ActivitySummary' } } }
  /activities/{id}/items/{itemId}:
    patch:
      tags: [activities]
      summary: 줍기 카테고리·수량 수정
      parameters:
        - { $ref: '#/components/parameters/ActivityId' }
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { $ref: '#/components/schemas/Category' }
                quantity: { type: integer, minimum: 1, maximum: 999, description: 상한 초과는 422 VALIDATION }
      responses:
        '200':
          description: 갱신된 요약
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/ActivitySummary' } } }
              example:
                data: { itemCount: 27, byCategory: { CIGARETTE: 14, PLASTIC: 6, CAN: 3, PAPER: 2, VINYL: 2 }, items: [] }
    delete:
      tags: [activities]
      summary: 줍기 삭제
      parameters:
        - { $ref: '#/components/parameters/ActivityId' }
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      responses: { '204': { description: 완료 } }
  /activities/{id}/live:
    post:
      tags: [activities]
      summary: 배경 위치 보고 — 소켓이 끊긴 배경 상태 전용. 평소엔 소켓 /app/crew/live
      parameters: [{ $ref: '#/components/parameters/ActivityId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [distanceM, itemCount, elapsedSec, paused]
              properties:
                location:
                  type: object
                  nullable: true
                  properties: { lng: { type: number }, lat: { type: number } }
                distanceM: { type: integer }
                itemCount: { type: integer }
                elapsedSec: { type: integer }
                paused: { type: boolean }
      responses: { '204': { description: 완료 } }
  /activities/{id}/end:
    post:
      tags: [activities]
      summary: 종료 — 경로·거리·시간·선택 걸음수를 한 번에
      description: 같은 활동 UUID의 반복 종료는 저장된 결과를 200으로 반환하고 집계를 중복 가산하지 않는다. 짧거나 수량 0인 활동도 저장한다. 앱은 오프라인 종료를 영속 저장하고 줍기 큐 처리 후 이 요청을 재시도한다. 서버 저장 완료 후에만 요약 이미지를 공유한다
      parameters: [{ $ref: '#/components/parameters/ActivityId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endedAt, durationSec, pausedSec, distanceM, route]
              properties:
                endedAt: { type: string, format: date-time }
                durationSec: { type: integer, minimum: 0 }
                pausedSec: { type: integer, minimum: 0 }
                distanceM: { type: integer, minimum: 0, description: 필터 적용 후 값. 사용 가능한 걸음수가 있을 때만 보정 }
                steps: { type: integer, minimum: 0, nullable: true, description: 선택 측정값. 일시정지 제외. 미측정은 null }
                route:
                  type: array
                  description: 필터 통과한 점만. [lng, lat]
                  items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
      responses:
        '200':
          description: 종료된 활동
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Activity' } } }
  /activities/{id}:
    get:
      tags: [activities]
      summary: 활동 기록 상세 (5-3)
      description: 본인은 소속 없이 이전 크루 기록까지 조회한다. 타인은 현재 같은 크루의 활동 메타데이터·사진을 locationShared와 무관하게 조회하며 locationShared=true일 때만 route 포함. 모든 사진 조회 가능. 요약 공유는 별도 경로 포함 선택을 하는 이미지이며 게시물 연결이 아니다
      parameters: [{ $ref: '#/components/parameters/ActivityId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Activity' } } }
              example:
                data:
                  id: a100
                  user: { id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false }
                  status: ENDED
                  startedAt: 2026-09-05T09:02:00Z
                  endedAt: 2026-09-05T09:48:00Z
                  durationSec: 2520
                  pausedSec: 240
                  paused: false
                  pausedAt: null
                  distanceM: 3120
                  steps: 4100
                  locationShared: true
                  itemCount: 27
                  byCategory: { CIGARETTE: 14, PLASTIC: 6, CAN: 3, PAPER: 2, VINYL: 2 }
                  route: [[126.93, 37.52], [126.931, 37.521]]
                  photos:
                    - { id: p1, url: https://cdn…/a100/p1.jpg, thumbUrl: https://cdn…/a100/p1_t.jpg, takenAt: 2026-09-05T09:10:00Z }
                  items:
                    - { id: 00000000-0000-4000-8000-000000000001, photoId: p1, category: PLASTIC, quantity: 2, source: AI, aiConfidence: 0.91, unclassified: false, bbox: { x: 0.2, y: 0.3, w: 0.2, h: 0.25 } }
                    - { id: 00000000-0000-4000-8000-000000000002, photoId: null, category: CIGARETTE, quantity: 5, source: MANUAL, aiConfidence: null, unclassified: false, bbox: null }
    delete:
      tags: [activities]
      summary: 내 활동 삭제 — 크루 합산(crew_daily_stats)은 줄어든다. 본인 것만
      parameters: [{ $ref: '#/components/parameters/ActivityId' }]
      responses: { '204': { description: 완료 } }
  /crew/live:
    get:
      tags: [activities]
      summary: 활동 중인 크루원 (2-2, 4-3 초기 로드). 이후 갱신은 소켓 (배열)
      description: 조회자는 활동 중일 필요 없다. 좌표는 대상이 IN_PROGRESS이고 locationShared=true일 때만 제공한다. 종료 대상은 제외, 차단 대상은 개인 조회에서 제외한다
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LiveMember' } }
              example:
                data:
                  - { user: { id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false }, activityId: a101, startedAt: 2026-09-07T08:30:00Z, elapsedSec: 900, distanceM: 1200, itemCount: 9, paused: false, locationShared: true, location: { lng: 126.93, lat: 37.52 } }
                  - { user: { id: 9b3e…, nickname: 지수, photoUrl: null, withdrawn: false }, activityId: a102, startedAt: 2026-09-07T08:40:00Z, elapsedSec: 300, distanceM: 400, itemCount: 2, paused: true, locationShared: false, location: null }

  # ───────────────────────── media ─────────────────────────
  /media:
    post:
      tags: [media]
      summary: 사진 업로드 + AI 추론 — 추론 실패는 200 + inference.status=UNAVAILABLE
      description: 업로드 성공 뒤 추론 실패해도 photoId와 사진을 보존하고 수동 분류한다. 활동 사진은 카메라 촬영만 사용하며 오프라인은 빠른 줍기로 기록한다. aiConfidence가 0.7 미만인 분류는 확인 필요로 표시하고 확률 퍼센트로 표시하지 않는다
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [mediaId, file, purpose]
              properties:
                mediaId: { type: string, format: uuid }
                file: { type: string, format: binary }
                purpose: { type: string, enum: [ACTIVITY, POST, PROFILE, CREW], description: ACTIVITY 만 추론 }
                activityId: { type: string, format: uuid, description: ACTIVITY 일 때 }
                takenAt: { type: string, format: date-time }
                lat: { type: number }
                lng: { type: number }
      responses:
        '200':
          description: 저장됨
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/MediaResult' } } }
              example:
                data:
                  mediaId: m001
                  photoId: p1
                  url: https://cdn…/a100/p1.jpg
                  thumbUrl: https://cdn…/a100/p1_t.jpg
                  inference:
                    status: OK
                    modelVersion: yolo26s-1024-v1
                    inferenceMs: 180
                    items:
                      - { category: PLASTIC, aiConfidence: 0.91, bbox: { x: 0.2, y: 0.3, w: 0.2, h: 0.25 } }
                      - { category: PLASTIC, aiConfidence: 0.62, bbox: { x: 0.6, y: 0.4, w: 0.15, h: 0.2 } }
                      - { category: CAN, aiConfidence: 0.88, bbox: { x: 0.1, y: 0.7, w: 0.1, h: 0.15 } }

  # ───────────────────────── posts ─────────────────────────
  /crew/posts:
    get:
      tags: [posts]
      summary: 피드 (5-1). scope=CREW 는 크루 전체, MINE 은 나만 보기 포함 내 글
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [CREW, MINE], default: CREW }
        - in: query
          name: before
          schema: { type: string, format: date }
          description: 달력에서 고른 날짜. 그날 이전(포함)부터
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/PostPage' }
    post:
      tags: [posts]
      summary: 게시물 작성 (5-6)
      description: 본문 또는 사진 중 하나 이상 필요. 사진만이면 text는 빈 문자열, 글만이면 mediaIds는 빈 배열. 활동 요약은 이미지뿐이다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, text, visibility, mediaIds]
              properties:
                id: { type: string, format: uuid }
                text: { type: string, maxLength: 1000 }
                visibility: { type: string, enum: [CREW, PRIVATE] }
                mediaIds: { type: array, items: { type: string, format: uuid }, maxItems: 10 }
      responses:
        '201':
          description: 생성
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Post' } } }
  /posts/{postId}:
    get:
      tags: [posts]
      summary: 게시물 상세 + 댓글 (5-2)
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Post'
                      - type: object
                        properties:
                          comments: { type: array, items: { $ref: '#/components/schemas/Comment' } }
              example:
                data:
                  id: po77
                  author: { id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false }
                  text: 오늘 여의도 3km. 꽁초가 유난히 많았다
                  visibility: CREW
                  media:
                    - { url: https://cdn…/po77/1.jpg, thumbUrl: https://cdn…/po77/1_t.jpg }
                    - { url: https://cdn…/po77/2.jpg, thumbUrl: https://cdn…/po77/2_t.jpg }
                  likeCount: 6
                  liked: true
                  commentCount: 2
                  createdAt: 2026-09-06T11:00:00Z
                  comments:
                    - { id: c1, author: { id: 9b3e…, nickname: 지수, photoUrl: null, withdrawn: false }, text: 오늘 많이 주우셨네요!, createdAt: 2026-09-06T12:00:00Z }
                    - { id: c2, author: { id: 0c4f…, nickname: 탈퇴한 크루원, photoUrl: null, withdrawn: true }, text: 다음엔 같이 가요, createdAt: 2026-09-06T13:00:00Z }
    delete:
      tags: [posts]
      summary: 삭제 — 작성자 또는 크루장(Q39). 크루장이 지우면 작성자에게 POST_REMOVED 알림
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      responses: { '204': { description: 완료 } }
  /posts/{postId}/like:
    put:
      tags: [posts]
      summary: 좋아요
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      responses: { '204': { description: 완료 } }
    delete:
      tags: [posts]
      summary: 좋아요 취소
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      responses: { '204': { description: 완료 } }
  /posts/{postId}/comments:
    post:
      tags: [posts]
      summary: 댓글 작성
      parameters: [{ $ref: '#/components/parameters/PostId' }]
      requestBody: { $ref: '#/components/requestBodies/CommentInput' }
      responses:
        '201':
          description: 생성
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Comment' } } }
              example:
                data: { id: c3, author: { id: 6f1c…, nickname: 관열, photoUrl: null, withdrawn: false }, text: 저도 다음엔 갈게요, createdAt: 2026-09-06T14:00:00Z }
  /comments/{commentId}:
    delete:
      tags: [posts]
      summary: 댓글 삭제 — 작성자 또는 크루장
      parameters: [{ $ref: '#/components/parameters/CommentId' }]
      responses: { '204': { description: 완료 } }

  # ───────────────────────── notices ─────────────────────────
  /crew/notices:
    get:
      tags: [notices]
      summary: 공지 목록 (3-5) — 최신 작성순
      description: 삭제되지 않은 최신 공지 한 건만 자동 노출. 수동 고정 없음
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Notice' } }
                      nextCursor: { type: string, nullable: true }
              example:
                data:
                  items:
                    - { id: n01, title: 9월 정기 활동 안내, preview: "9월 첫째 주 토요일, 여의도에서 모여요.", pinned: true, commentCount: 2, createdAt: 2026-09-01T09:00:00Z }
                    - { id: n00, title: 새 크루원 환영합니다, preview: 소개를 확인해 주세요., pinned: false, commentCount: 0, createdAt: 2026-08-28T09:00:00Z }
                  nextCursor: null
    post:
      tags: [notices]
      summary: "[크루장] 공지 작성 (3-12)"
      requestBody: { $ref: '#/components/requestBodies/NoticeInput' }
      responses:
        '201':
          description: 생성
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Notice' } } }
              example:
                data: { id: n02, title: 10월 정기 활동 안내, preview: 10월 첫째 주 토요일에 모여요., pinned: true, commentCount: 0, createdAt: 2026-09-28T09:00:00Z }
  /notices/{noticeId}:
    get:
      tags: [notices]
      summary: 공지 상세 + 댓글 (3-6)
      parameters: [{ $ref: '#/components/parameters/NoticeId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Notice'
                      - type: object
                        properties:
                          body: { type: string }
                          comments: { type: array, items: { $ref: '#/components/schemas/Comment' } }
              example:
                data:
                  id: n01
                  title: 9월 정기 활동 안내
                  preview: 9월 첫째 주 토요일, 여의도에서 모여요.
                  pinned: true
                  commentCount: 2
                  createdAt: 2026-09-01T09:00:00Z
                  body: |-
                    9월 첫째 주 토요일, 여의도에서 모여요.
                    오전 8시 여의나루역 2번 출구 앞입니다. 집게와 봉투는 크루에서 준비해요.
                  comments:
                    - { id: nc1, author: { id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false }, text: 확인했습니다!, createdAt: 2026-09-01T10:00:00Z }
                    - { id: nc2, author: { id: 6f1c…, nickname: 관열, photoUrl: null, withdrawn: false }, text: 비 오면 일요일로 미뤄요., createdAt: 2026-09-01T11:00:00Z }
    patch:
      tags: [notices]
      summary: "[크루장] 수정·고정"
      parameters: [{ $ref: '#/components/parameters/NoticeId' }]
      requestBody: { $ref: '#/components/requestBodies/NoticeInput' }
      responses: { '204': { description: 완료 } }
    delete:
      tags: [notices]
      summary: "[크루장] 삭제"
      parameters: [{ $ref: '#/components/parameters/NoticeId' }]
      responses: { '204': { description: 완료 } }
  /notices/{noticeId}/comments:
    post:
      tags: [notices]
      summary: 공지 댓글
      parameters: [{ $ref: '#/components/parameters/NoticeId' }]
      requestBody: { $ref: '#/components/requestBodies/CommentInput' }
      responses:
        '201':
          description: 생성
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Comment' } } }
              example:
                data: { id: 00000000-0000-4000-8000-0000000000c3, author: { id: 6f1c…, nickname: 관열, photoUrl: null, withdrawn: false }, text: 저도 참여할게요., createdAt: 2026-09-01T12:00:00Z }
  /notice-comments/{commentId}:
    delete:
      tags: [notices]
      summary: 공지 댓글 삭제 — 작성자 또는 크루장
      parameters: [{ $ref: '#/components/parameters/CommentId' }]
      responses: { '204': { description: 완료 } }

  # ───────────────────────── chat (이력만, 실시간은 소켓) ─────────────────────────
  /crew/chat/messages:
    get:
      tags: [chat]
      summary: 메시지 이력 — beforeSeq 는 거꾸로, afterSeq 는 재연결 뒤 빈 구간 채우기. 실시간은 realtime.md
      parameters:
        - in: query
          name: beforeSeq
          schema: { type: integer }
        - in: query
          name: afterSeq
          schema: { type: integer }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
                      hasMore: { type: boolean }
              example:
                data:
                  items:
                    - { seq: 101, id: 00000000-0000-4000-8000-000000000101, author: { id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false }, text: 내일 여의도 9시 어때요?, createdAt: 2026-09-06T06:24:00Z }
                    - { seq: 102, id: 00000000-0000-4000-8000-000000000102, author: { id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false }, text: 봉투는 제가 챙길게요., createdAt: 2026-09-06T06:24:30Z }
                    - { seq: 103, id: 00000000-0000-4000-8000-000000000103, author: { id: 6f1c…, nickname: 관열, photoUrl: null, withdrawn: false }, text: "좋아요, 갈게요!", createdAt: 2026-09-06T06:25:00Z }
                  hasMore: false
  /crew/chat/read:
    put:
      tags: [chat]
      summary: 읽음 위치 갱신
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [lastSeq], properties: { lastSeq: { type: integer } } }
      responses: { '204': { description: 완료 } }

  # ───────────────────────── notifications ─────────────────────────
  /notifications:
    get:
      tags: [notifications]
      summary: 알림 목록 (2-3). 크루장은 pending 에 처리 대기가 따로 온다
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pending:
                        type: object
                        description: 크루장만. 크루원은 둘 다 0
                        properties:
                          joinRequests: { type: integer }
                          reports: { type: integer }
                      items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                      nextCursor: { type: string, nullable: true }
              example:
                data:
                  pending: { joinRequests: 2, reports: 1 }
                  items:
                    - { id: 501, type: ACTIVITY_STARTED, title: 상혁 님이 줍깅을 시작했어요, detail: 여의도 근처, unread: true, target: { type: LIVE, id: a101 }, createdAt: 2026-09-07T08:30:05Z }
                    - { id: 500, type: COMMENT, title: 지수 님이 댓글을 남겼어요, detail: "오늘 많이 주우셨네요!", unread: false, target: { type: POST, id: po77 }, createdAt: 2026-09-06T21:10:00Z }
                  nextCursor: null
  /notifications/read:
    post:
      tags: [notifications]
      summary: 읽음 처리 — ids 없으면 전체
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { ids: { type: array, items: { type: integer } } } }
      responses: { '204': { description: 완료 } }
  /notifications/unread-count:
    get:
      tags: [notifications]
      summary: 홈 벨 배지
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { count: { type: integer } } } } }
              example: { data: { count: 1 } }

  # ───────────────────────── reports ─────────────────────────
  /reports:
    post:
      tags: [reports]
      summary: 신고 (6-1) — 크루장에게 REPORT 알림
      description: reason=OTHER이면 공백뿐이지 않은 memo가 필수다. 같은 신고자의 같은 targetType·targetId 중복 신고는 409 CONFLICT. 동일 id 재전송은 공통 멱등 규칙으로 흡수한다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, targetType, targetId, reason]
              properties:
                id: { type: string, format: uuid }
                targetType: { type: string, enum: [USER, POST, COMMENT, NOTICE_COMMENT, CHAT_MESSAGE] }
                targetId: { type: string }
                reason: { type: string, enum: [SPAM, HATE, INAPPROPRIATE_PHOTO, PRIVACY, OTHER] }
                memo: { type: string, maxLength: 500 }
      responses:
        '201': { description: 접수 }
        '409': { $ref: '#/components/responses/Error' }
  /crew/reports:
    get:
      tags: [reports]
      summary: "[크루장] 대기 중인 신고 (6-2)"
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Report' } }
                      nextCursor: { type: string, nullable: true }
  /crew/reports/{reportId}:
    post:
      tags: [reports]
      summary: "[크루장] 처리 — DELETE 는 대상 게시물·댓글·채팅을 지운다. USER 신고는 DISMISS 또는 별도 추방"
      description: 처리 시 신고자에게 REPORT_RESOLVED 알림으로 결과를 전달한다. USER에 DELETE는 허용하지 않는다
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [result], properties: { result: { type: string, enum: [DELETE, DISMISS] } } }
      responses: { '204': { description: 완료 } }

  # ───────────────────────── stats ─────────────────────────
  /crew/home:
    get:
      tags: [stats]
      summary: 홈 한 번에 (2-1)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/Home' } } }
              example:
                data:
                  crew: { id: c001, name: 한강줍깅크루 }
                  last7d:
                    crewItems: 168
                    myItems: 23
                    myByCategory: { CIGARETTE: 14, PLASTIC: 6, CAN: 3 }
                    daily: [12, 30, 0, 41, 25, 38, 22]
                  character:
                    windowDays: 14
                    items: 312
                    goalCount: 300
                    stage: 5
                  live: { count: 2, users: [{ id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false }, { id: 9b3e…, nickname: 지수, photoUrl: null, withdrawn: false }] }
                  unreadNotifications: 3
  /crew/stats:
    get:
      tags: [stats]
      summary: 크루 기록 (3-4)
      description: KST 기준 WEEK는 이번 월요일 00시부터, MONTH는 이번 달 1일 00시부터 현재까지. ALL은 전체 기간이며 추이는 월별(월 1일 date), WEEK/MONTH는 일별. 순위는 줍기 수량 내림차순이며 동수량은 공동 순위
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [WEEK, MONTH, ALL], default: MONTH }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { $ref: '#/components/schemas/CrewStats' } } }
              example:
                data:
                  range: MONTH
                  totals: { items: 1430, distanceM: 128000, durationSec: 96000, activities: 62 }
                  byCategory: { CIGARETTE: 620, PLASTIC: 310, CAN: 190, PAPER: 120, VINYL: 110, GLASS: 40, GENERAL: 40 }
                  series: [{ date: 2026-09-01, items: 40 }, { date: 2026-09-02, items: 0 }, { date: 2026-09-03, items: 77 }]
                  ranking:
                    - { rank: 1, user: { id: 6f1c…, nickname: 관열, photoUrl: null, withdrawn: false }, items: 412, distanceM: 30100 }
                    - { rank: 2, user: { id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false }, items: 380, distanceM: 28800 }
  /crew/calendar:
    get:
      tags: [stats]
      summary: 활동 달력 한 달 (3-9)
      description: KST 날짜 기준. 활동 수는 사람 수가 아닌 활동 횟수
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      days:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, format: date }
                            items: { type: integer }
                            activityCount: { type: integer, description: 해당 날짜의 활동 횟수 }
                            activities:
                              type: array
                              items:
                                type: object
                                properties:
                                  activityId: { type: string }
                                  user: { $ref: '#/components/schemas/UserBrief' }
                                  items: { type: integer }
                                  distanceM: { type: integer }
              example:
                data:
                  days:
                    - date: 2026-09-02
                      items: 12
                      activityCount: 1
                      activities:
                        - { activityId: a098, user: { id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false }, items: 12, distanceM: 900 }
                    - date: 2026-09-05
                      items: 47
                      activityCount: 2
                      activities:
                        - { activityId: a100, user: { id: 6f1c…, nickname: 관열, photoUrl: null, withdrawn: false }, items: 32, distanceM: 2100 }
                        - { activityId: a101, user: { id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false }, items: 15, distanceM: 1300 }
  /crew/export:
    get:
      tags: [stats]
      summary: "[크루장] CSV — 활동 한 회가 한 행 (Q34)"
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: |
            `text/csv; charset=utf-8` (BOM 포함 — 엑셀). 열: 날짜, 크루원, 시작, 종료, 거리(m), 시간(초), 총개수, 담배꽁초, 캔, 플라스틱, 종이, 유리, 비닐, 일반
          content:
            text/csv:
              schema: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
    Limit:
      in: query
      name: limit
      schema: { type: integer, default: 20, maximum: 50 }
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string }
    ActivityId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    PostId:
      in: path
      name: postId
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      in: path
      name: commentId
      required: true
      schema: { type: string, format: uuid }
    NoticeId:
      in: path
      name: noticeId
      required: true
      schema: { type: string, format: uuid }

  requestBodies:
    SocialToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token: { type: string, description: 카카오 accessToken / 구글 idToken }
              nickname: { type: string, minLength: 2, maxLength: 12, description: 첫 가입 때 선택. 없으면 profileComplete=false로 PATCH /users/me에서 이어간다 }
    CommentInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id, text]
            properties:
              id: { type: string, format: uuid }
              text: { type: string, maxLength: 500 }
    NoticeInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string, maxLength: 100 }
              body: { type: string, maxLength: 3000 }

  responses:
    Error:
      description: |
        공통 오류. TOKEN_EXPIRED 401 · INVALID_CREDENTIALS 401 · FORBIDDEN 403 · NO_CREW 403 ·
        LEADER_MUST_DELEGATE 403 · NOT_FOUND 404 · CONFLICT 409 · EMAIL_TAKEN 409 · NICKNAME_TAKEN 409 · ALREADY_IN_CREW 409 ·
        VALIDATION 422 · RATE_LIMITED 429 · INTERNAL 500. message 는 개발자용
      content:
        application/json:
          schema:
            type: object
            required: [code, message, requestId]
            properties:
              code: { type: string }
              message: { type: string }
              requestId: { type: string }
              fields:
                type: array
                description: |
                  VALIDATION 422 일 때만. 화면이 해당 입력 아래에 오류를 붙이는 데 쓴다.
                  다른 코드에서는 생략한다
                items:
                  type: object
                  required: [field, code]
                  properties:
                    field: { type: string, description: 요청 본문의 속성 이름 }
                    code: { type: string, description: 예 TOO_SHORT · TOO_LONG · TAKEN · FORMAT }
    TokenPair:
      description: 토큰 쌍
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  isNew: { type: boolean, description: 최초 발급 여부만 표시. 재진입 분기는 Me.profileComplete와 membership으로 판단 }
          example:
            data:
              accessToken: eyJhbGciOiJIUzI1NiJ9.mock…
              refreshToken: 8f2a9c1e-mock-refresh…
              isNew: false
    ActivityPage:
      description: 활동 목록
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ActivityCard' } }
                  nextCursor: { type: string, nullable: true }
    PostPage:
      description: 게시물 목록
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Post' } }
                  nextCursor: { type: string, nullable: true }
          example:
            data:
              items:
                - id: po77
                  author: { id: 8a2d…, nickname: 상혁, photoUrl: null, withdrawn: false }
                  text: 오늘 여의도 3km. 꽁초가 유난히 많았다
                  visibility: CREW
                  media: [{ url: https://cdn…/po77/1.jpg, thumbUrl: https://cdn…/po77/1_t.jpg }]
                  likeCount: 6
                  liked: true
                  commentCount: 2
                  createdAt: 2026-09-06T11:00:00Z
                - id: po78
                  author: { id: 6f1c…, nickname: 관열, photoUrl: null, withdrawn: false }
                  text: 다음 주엔 망원 쪽을 돌아볼 생각. 같이 갈 사람?
                  visibility: PRIVATE
                  media: []
                  likeCount: 0
                  liked: false
                  commentCount: 0
                  createdAt: 2026-09-05T02:00:00Z
              nextCursor: null

  schemas:
    Category:
      type: string
      enum: [CIGARETTE, CAN, PLASTIC, PAPER, GLASS, VINYL, GENERAL]
    UserBrief:
      type: object
      required: [id, nickname, withdrawn]
      properties:
        id: { type: string }
        nickname: { type: string, description: 탈퇴했으면 "탈퇴한 크루원" }
        photoUrl: { type: string, nullable: true }
        withdrawn:
          type: boolean
          description: |
            탈퇴 여부. 닉네임 문자열로 판별하지 않는다 — 같은 닉네임의 살아 있는 계정과
            구별되지 않는다. true 면 프로필 열기·팔로우·차단 등 그 사람을 향한 행동을 감춘다
    Me:
      type: object
      required: [profileComplete]
      properties:
        id: { type: string }
        profileComplete: { type: boolean, description: 닉네임 설정 완료 여부. false면 닉네임 화면 재개. 약관 동의 완료를 뜻하지 않음 }
        nickname: { type: string, nullable: true }
        intro: { type: string }
        photoUrl: { type: string, nullable: true }
        email: { type: string, nullable: true }
        hasPassword: { type: boolean }
        linked:
          type: object
          properties: { kakao: { type: boolean }, google: { type: boolean } }
        settings:
          type: object
          properties:
            shareLocationDefault: { type: boolean }
            notifyActivityStart: { type: boolean }
        membership:
          type: object
          properties:
            status: { type: string, enum: [NONE, PENDING, MEMBER], description: NONE→1-6 · PENDING→1-9 · MEMBER→탭 }
            crew:
              type: object
              nullable: true
              properties:
                id: { type: string }
                name: { type: string }
                isLeader: { type: boolean }
    Crew:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        intro: { type: string }
        photoUrl: { type: string, nullable: true }
        leader: { $ref: '#/components/schemas/UserBrief' }
        memberCount: { type: integer }
        goalCount: { type: integer }
        inviteCode: { type: string }
        pendingJoinRequests: { type: integer, description: "크루장만 값. 크루원은 0" }
        pinnedNotice:
          description: 삭제되지 않은 최신 공지 한 건 자동 선택. 없으면 null
          type: object
          nullable: true
          properties:
            id: { type: string }
            title: { type: string }
            createdAt: { type: string, format: date-time }
        unreadChat: { type: integer }
        isLeader: { type: boolean }
    JoinRequest:
      type: object
      properties:
        id: { type: string }
        crew: { type: object, properties: { id: { type: string }, name: { type: string } } }
        user: { $ref: '#/components/schemas/UserBrief' }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELED] }
        createdAt: { type: string, format: date-time }
    Member:
      allOf:
        - $ref: '#/components/schemas/UserBrief'
        - type: object
          properties:
            isLeader: { type: boolean }
            totalItems: { type: integer }
            joinedAt: { type: string, format: date-time }
            following: { type: boolean }
    MemberStats:
      type: object
      properties:
        totalItems: { type: integer }
        totalDistanceM: { type: integer }
        totalActivities: { type: integer }
        activeDays:
          type: array
          description: KST 최근 6개월 활동한 날짜 — 프로필 달력
          items: { type: string, format: date }
    MemberProfile:
      allOf:
        - $ref: '#/components/schemas/Member'
        - $ref: '#/components/schemas/MemberStats'
        - type: object
          properties:
            intro: { type: string }
            blocked: { type: boolean }
    ItemInput:
      type: object
      required: [id, category, quantity]
      properties:
        id: { type: string, format: uuid, description: 앱이 만든다. 같은 id 재전송은 200 으로 흡수(멱등) }
        category: { $ref: '#/components/schemas/Category' }
        quantity: { type: integer, minimum: 1, maximum: 999, description: 상한 초과는 422 VALIDATION }
        aiPredictedCategory: { $ref: '#/components/schemas/Category' }
        aiConfidence: { type: number, nullable: true }
        bbox: { $ref: '#/components/schemas/Bbox' }
    Bbox:
      type: object
      nullable: true
      properties:
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }
    Item:
      type: object
      properties:
        id: { type: string, format: uuid, description: 앱이 만든 ItemInput.id 그대로 }
        photoId: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/Category' }
        quantity: { type: integer }
        source: { type: string, enum: [AI, MANUAL] }
        aiConfidence: { type: number, nullable: true }
        unclassified: { type: boolean }
        bbox: { $ref: '#/components/schemas/Bbox' }
    ActivitySummary:
      type: object
      properties:
        itemCount: { type: integer }
        byCategory:
          type: object
          additionalProperties: { type: integer }
        items: { type: array, items: { $ref: '#/components/schemas/Item' }, description: 이번 요청으로 만들어진 줍기. 되돌리기(DELETE)에 쓴다 }
    ActivityCard:
      type: object
      properties:
        id: { type: string }
        startedAt: { type: string, format: date-time }
        durationSec: { type: integer }
        distanceM: { type: integer }
        itemCount: { type: integer }
        thumbUrl: { type: string, nullable: true }
    Activity:
      type: object
      required: [paused, pausedAt]
      properties:
        id: { type: string }
        user: { $ref: '#/components/schemas/UserBrief' }
        status: { type: string, enum: [IN_PROGRESS, ENDED] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        durationSec: { type: integer }
        pausedSec: { type: integer }
        paused: { type: boolean, description: 재실행 시 복원할 일시정지 상태. 종료 시 false }
        pausedAt: { type: string, format: date-time, nullable: true, description: 일시정지 시작 시각. 재개·종료 시 null }
        distanceM: { type: integer }
        steps: { type: integer, minimum: 0, nullable: true, description: 선택 측정값. 일시정지 제외. 미측정은 null }
        locationShared: { type: boolean }
        itemCount: { type: integer }
        byCategory: { type: object, additionalProperties: { type: integer } }
        route:
          type: array
          nullable: true
          description: 남의 활동이고 locationShared=false 면 null
          items: { type: array, items: { type: number } }
        photos:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              url: { type: string }
              thumbUrl: { type: string }
              takenAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/Item' } }
    LiveMember:
      type: object
      required: [locationShared]
      properties:
        user: { $ref: '#/components/schemas/UserBrief' }
        activityId: { type: string }
        startedAt: { type: string, format: date-time }
        elapsedSec: { type: integer }
        distanceM: { type: integer }
        itemCount: { type: integer }
        paused: { type: boolean }
        locationShared: { type: boolean, description: false는 공유 끔. true인데 location=null이면 좌표 확인 중 }
        location:
          type: object
          nullable: true
          description: IN_PROGRESS이며 locationShared=true인 대상만 좌표 제공. 그 외 null
          properties: { lng: { type: number }, lat: { type: number } }
    MediaResult:
      type: object
      properties:
        mediaId: { type: string }
        photoId: { type: string, nullable: true, description: purpose=ACTIVITY 일 때 activity_photos.id }
        url: { type: string }
        thumbUrl: { type: string }
        inference:
          type: object
          nullable: true
          properties:
            status: { type: string, enum: [OK, UNAVAILABLE] }
            modelVersion: { type: string }
            inferenceMs: { type: integer }
            items:
              type: array
              items:
                type: object
                properties:
                  category: { $ref: '#/components/schemas/Category' }
                  aiConfidence: { type: number }
                  bbox: { $ref: '#/components/schemas/Bbox' }
    Post:
      type: object
      properties:
        id: { type: string }
        author: { $ref: '#/components/schemas/UserBrief' }
        text: { type: string }
        visibility: { type: string, enum: [CREW, PRIVATE] }
        media:
          type: array
          items:
            type: object
            properties: { url: { type: string }, thumbUrl: { type: string } }
        likeCount: { type: integer }
        liked: { type: boolean }
        commentCount: { type: integer }
        createdAt: { type: string, format: date-time }
    Comment:
      type: object
      properties:
        id: { type: string }
        author: { $ref: '#/components/schemas/UserBrief' }
        text: { type: string }
        createdAt: { type: string, format: date-time }
    Notice:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        preview: { type: string, description: 본문 첫 줄 }
        pinned: { type: boolean, readOnly: true, description: 최신 공지 한 건이면 true인 파생 값. 수동 설정 불가 }
        commentCount: { type: integer }
        createdAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      properties:
        seq: { type: integer }
        id: { type: string }
        author: { $ref: '#/components/schemas/UserBrief' }
        text: { type: string }
        createdAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [JOIN_REQUEST, JOIN_APPROVED, JOIN_REJECTED, NOTICE, COMMENT, CHAT, ACTIVITY_STARTED, REPORT, REPORT_RESOLVED, POST_REMOVED]
        title: { type: string }
        detail: { type: string }
        unread: { type: boolean }
        target:
          type: object
          description: 이동 대상. JOIN_REQUESTS→3-8 · REPORTS→6-2 · POST→5-2 · NOTICE→3-6 · CHAT→3-7 · LIVE→2-2 · CREW→1-6/탭 · NOTIFICATIONS→2-3 (신고 결과는 title/detail, 크루장 처리 화면으로 보내지 않음)
          properties:
            type: { type: string, enum: [JOIN_REQUESTS, REPORTS, POST, NOTICE, CHAT, LIVE, CREW, NOTIFICATIONS] }
            id: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Report:
      type: object
      properties:
        id: { type: string }
        reporter: { $ref: '#/components/schemas/UserBrief' }
        targetType: { type: string }
        targetId: { type: string }
        targetPreview: { type: string, description: 게시물·댓글 본문 앞부분 또는 사용자 닉네임 }
        reason: { type: string }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Home:
      type: object
      properties:
        crew: { type: object, properties: { id: { type: string }, name: { type: string } } }
        last7d:
          type: object
          properties:
            crewItems: { type: integer }
            myItems: { type: integer }
            myByCategory: { type: object, additionalProperties: { type: integer }, description: 최근 7일 내가 주운 것의 카테고리별 수량. 0 인 카테고리는 생략 }
            daily: { type: array, items: { type: integer }, minItems: 7, maxItems: 7, description: 6일 전 → 오늘 }
        character:
          type: object
          properties:
            windowDays: { type: integer }
            items: { type: integer }
            goalCount: { type: integer }
            stage: { type: integer, minimum: 1, maximum: 5, description: 1 축 처짐 · 2 보통 · 3 신남 · 4 반짝 · 5 파티. 서버가 items/goalCount 로 계산 }
        live:
          type: object
          properties:
            count: { type: integer }
            users: { type: array, items: { $ref: '#/components/schemas/UserBrief' }, maxItems: 5 }
        unreadNotifications: { type: integer }
    CrewStats:
      type: object
      properties:
        range: { type: string }
        totals:
          type: object
          properties:
            items: { type: integer }
            distanceM: { type: integer }
            durationSec: { type: integer }
            activities: { type: integer }
        byCategory: { type: object, additionalProperties: { type: integer } }
        series:
          type: array
          items: { type: object, properties: { date: { type: string, format: date }, items: { type: integer } } }
        ranking:
          type: array
          items:
            type: object
            properties:
              rank: { type: integer }
              user: { $ref: '#/components/schemas/UserBrief' }
              items: { type: integer }
              distanceM: { type: integer }
